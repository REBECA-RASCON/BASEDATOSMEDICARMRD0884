<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualización de Citas Médicas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            padding: 40px;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 1000px;
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #2980b9;
            color: white;
            font-weight: bold;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .btn-refresh {
            background-color: #27ae60;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.3s;
        }
        .btn-refresh:hover {
            background-color: #219150;
        }
        .actions-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .add-link {
            color: #2980b9;
            text-decoration: none;
            font-weight: bold;
        }
        .add-link:hover {
            text-decoration: underline;
        }
        .no-data {
            text-align: center;
            color: #7f8c8d;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>LISTADO DE CITAS MÉDICAS REGISTRADAS</h2>

    <div class="actions-container">
        <a href="formcitas.html" class="add-link">+ Registrar Nueva Cita</a>
        <button class="btn-refresh" onclick="obtenerCitas()">🔄 Actualizar Tabla</button>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>ID CITA</th>
                <th>PACIENTE</th>
                <th>MÉDICO</th>
                <th>FECHA</th>
                <th>HORA</th>
                <th>SALA</th>
                <th>MOTIVO</th>
            </tr>
        </thead>
        <tbody id="tablaCitas">
            </tbody>
    </table>
</div>

<script>
    // FUNCIÓN PARA SOLICITAR LAS CITAS AL BACKEND
    function obtenerCitas() {
        const tbody = document.getElementById('tablaCitas');
        
        // Consultar tu servidor en Firebase Studio
        fetch('https://8080-rasconrebeca0884-84541037.idxdev.googleusercontent.com/api/citas')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Error al conectar con el servidor');
                }
                return response.json();
            })
            .then(citas => {
                tbody.innerHTML = ''; // Limpiar la tabla antes de rellenar

                if (citas.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="no-data">No hay citas médicas registradas en este momento.</td></tr>`;
                    return;
                }

                // RECÓRRER CADA CITA UTILIZANDO LOS CAMPOS CORREGIDOS
                citas.forEach(cita => {
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td><strong>${cita.id_cita || ''}</strong></td>
                        <td>${cita.paciente_nombre || 'Sin nombre'}</td>
                        <td>${cita.doctor_nombre || 'Sin médico'}</td>
                        <td>${cita.fecha || ''}</td>
                        <td>${cita.hora || ''}</td>
                        <td>${cita.sala || ''}</td>
                        <td>${cita.motivo_de_cita || ''}</td>
                    `;
                    tbody.appendChild(fila);
                });
            })
            .catch(error => {
                console.error('Error al cargar citas:', error);
                tbody.innerHTML = `<tr><td colspan="7" class="no-data" style="color: #c0392b;">Error: No se pudo conectar con el servidor. Verifica que Firebase Studio esté activo.</td></tr>`;
            });
    }

    // Cargar los datos automáticamente al abrir la página
    window.onload = obtenerCitas;
</script>

</body>
</html>

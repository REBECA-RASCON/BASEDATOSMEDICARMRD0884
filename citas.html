<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Citas - Consultorio Médico RMRD</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #e6f0fa;
            color: #333333;
        }

        .cabecera {
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 20px;
            border-bottom: 4px solid #002060;
        }

        .cabecera h1 {
            font-family: 'Montserrat', sans-serif;
            color: #002060;
            margin: 0;
            font-size: 30px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .menu_navegacion {
            display: flex;
            justify-content: space-around;
            background-color: #f0f6fc;
            padding: 15px 0;
            border-bottom: 1px solid #b0c9f0;
        }

        .menu_navegacion a {
            font-family: 'Montserrat', sans-serif;
            color: #2a75d3;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.3s;
        }

        .menu_navegacion a:hover {
            color: #002060;
        }

        .contenedor_tabla {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
            background-color: white;
        }

        .contenedor_tabla h2 {
            font-family: 'Montserrat', sans-serif;
            color: #2a75d3;
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-size: 22px;
        }

        .barra_botones {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .boton_volver {
            color: #555;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            font-family: 'Montserrat', sans-serif;
            transition: color 0.3s;
        }

        .boton_volver:hover { color: #002060; }

        .boton_formulario {
            display: inline-block;
            padding: 10px 20px;
            background-color: #002060;
            color: white;
            border-radius: 4px;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.3s ease;
        }

        .boton_formulario:hover { background-color: #2a75d3; }

        /* BARRA DE BÚSQUEDA */
        .barra_busqueda {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .barra_busqueda input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #b0c9f0;
            border-radius: 4px;
            font-family: 'Open Sans', sans-serif;
            font-size: 14px;
            background-color: #f8fbff;
            transition: border-color 0.3s;
        }

        .barra_busqueda input:focus {
            outline: none;
            border-color: #002060;
            background-color: #fff;
        }

        .barra_busqueda label {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 13px;
            color: #002060;
            white-space: nowrap;
        }

        .contador_resultados {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            font-size: 14px;
        }

        th {
            font-family: 'Montserrat', sans-serif;
            background-color: #002060;
            color: white;
            padding: 10px;
            text-align: left;
            border: 1px solid #002060;
        }

        td {
            padding: 10px;
            border: 1px solid #b0c9f0;
        }

        /* BOTÓN ELIMINAR */
        .btn_eliminar {
            background-color: #dc2626;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn_eliminar:hover { background-color: #991b1b; }

        footer {
            font-family: 'Montserrat', sans-serif;
            margin-top: 60px;
            padding: 15px;
            border-top: 2px dashed #002060;
            font-size: 11px;
            color: #555555;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header class="cabecera">
        <h1>Consultorio Médico RMRD</h1>
    </header>

    <nav class="menu_navegacion">
        <a href="pacientes.html">Clientes</a>
        <a href="doctores.html">Médicos</a>
        <a href="personal.html">Personal</a>
        <a href="citas.html">Citas</a>
    </nav>

    <main class="contenedor_tabla">

        <div class="barra_botones">
            <a href="index.html" class="boton_volver">&larr; Volver al Menú Principal</a>
            <a href="formcitas.html" class="boton_formulario">+ Registrar Nueva Cita</a>
        </div>

        <h2>CITAS</h2>

        <div class="barra_busqueda">
            <label for="campoBusqueda">🔍 Buscar:</label>
            <input type="text" id="campoBusqueda" placeholder="Paciente, doctor, sala, motivo...">
        </div>

        <p class="contador_resultados" id="contadorResultados"></p>

        <table>
            <thead>
                <tr>
                    <th>ID Cita</th>
                    <th>Paciente</th>
                    <th>Doctor</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Sala</th>
                    <th>Motivo de la Cita</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </main>

    <footer>
        REBECA MIRANDA RASCON DEVORA 4;J 24308051280884 PROGRAMACION
    </footer>

    <script>
        const API_URL = "https://prueba-rmrd.onrender.com/api/citas";
        let todasLasCitas = [];

        async function cargarCitas() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error("Error: " + res.status);
                todasLasCitas = await res.json();
                renderTabla(todasLasCitas);
            } catch (error) {
                console.error("Error al cargar citas:", error);
            }
        }

        function renderTabla(lista) {
            const cuerpoTabla = document.getElementById('cuerpoTabla');
            const contador = document.getElementById('contadorResultados');
            cuerpoTabla.innerHTML = "";
            contador.textContent = `Mostrando ${lista.length} registro(s)`;

            lista.forEach(cita => {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>${cita.id_cita ?? ''}</td>
                    <td>${cita.paciente_nombre ?? ''}</td>
                    <td>${cita.doctor_nombre ?? ''}</td>
                    <td>${cita.fecha ?? ''}</td>
                    <td>${cita.hora ?? ''}</td>
                    <td>${cita.sala ?? ''}</td>
                    <td>${cita.motivo_de_cita ?? ''}</td>
                    <td><button class="btn_eliminar" onclick="eliminar('${cita._id}')">🗑 Eliminar</button></td>
                `;
                cuerpoTabla.appendChild(fila);
            });
        }

        async function eliminar(id) {
            if (!confirm("¿Seguro que deseas eliminar esta cita? Esta acción no se puede deshacer.")) return;
            try {
                const res = await fetch(API_URL + '/' + id, { method: 'DELETE' });
                if (!res.ok) throw new Error("Error al eliminar");
                todasLasCitas = todasLasCitas.filter(c => c._id !== id);
                const textoBusqueda = document.getElementById('campoBusqueda').value;
                filtrar(textoBusqueda);
            } catch (error) {
                alert("No se pudo eliminar. Revisa la consola (F12).");
                console.error(error);
            }
        }

        function filtrar(texto) {
            const q = texto.toLowerCase().trim();
            if (!q) {
                renderTabla(todasLasCitas);
                return;
            }
            const filtradas = todasLasCitas.filter(c =>
                (c.paciente_nombre ?? '').toLowerCase().includes(q) ||
                (c.doctor_nombre ?? '').toLowerCase().includes(q) ||
                (c.sala ?? '').toLowerCase().includes(q) ||
                (c.motivo_de_cita ?? '').toLowerCase().includes(q) ||
                String(c.id_cita ?? '').includes(q)
            );
            renderTabla(filtradas);
        }

        document.getElementById('campoBusqueda').addEventListener('input', e => filtrar(e.target.value));

        cargarCitas();
    </script>
</body>
</html>

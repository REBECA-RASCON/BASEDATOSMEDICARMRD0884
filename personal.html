<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Personal - Consultorio Médico RMRD</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <style>

        body {
            font-family: 'Open Sans', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fefcbf;
            color: #333333;
        }

        .cabecera {
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 20px;
            border-bottom: 4px solid #b7791f;
        }

        .cabecera h1 {
            font-family: 'Montserrat', sans-serif;
            color: #b7791f;
            margin: 0;
            font-size: 30px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

       
        .menu_navegacion {
            display: flex;
            justify-content: space-around;
            background-color: #fef3c7;
            padding: 15px 0;
            border-bottom: 1px solid #d69e2e;
        }

        .menu_navegacion a {
            font-family: 'Montserrat', sans-serif;
            color: #744210;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.3s;
        }

        .menu_navegacion a:hover {
            color: #b7791f;
        }

        .contenedor_tabla {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background-color: white;
        }

        .contenedor_tabla h2 {
            font-family: 'Montserrat', sans-serif;
            color: #744210;
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-size: 22px;
        }

        
        .barra_botones {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .boton_volver {
            color: #744210;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            font-family: 'Montserrat', sans-serif;
        }

        .boton_volver:hover {
            color: #b7791f;
        }

        .boton_formulario {
            display: inline-block;
            padding: 10px 20px;
            background-color: #744210;
            color: white;
            border-radius: 4px;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.3s ease;
        }

        .boton_formulario:hover {
            background-color: #b7791f;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            font-size: 12px;
        }

        th {
            font-family: 'Montserrat', sans-serif;
            background-color: #744210;
            color: white;
            padding: 10px 8px;
            text-align: left;
            border: 1px solid #744210;
            text-transform: uppercase;
        }

        td {
            padding: 10px 8px;
            border: 1px solid #fef3c7;
        }

        .texto_capital {
            text-transform: capitalize;
        }

        footer {
            font-family: 'Montserrat', sans-serif;
            margin-top: 60px;
            padding: 15px;
            border-top: 2px dashed #b7791f;
            font-size: 11px;
            color: #555555;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header class="cabecera">
        <h1>Consultorio Médico RMRD</h1>
    </header>

    <nav class="menu_navegacion">
        <a href="pacientes.html">Clientes</a>
        <a href="doctores.html">Médicos</a>
        <a href="personal.html">Personal</a>
        <a href="citas.html">Citas</a>
    </nav>

    <main class="contenedor_tabla">

        <div class="barra_botones">
            <a href="index.html" class="boton_volver">
                &larr; Volver al Menú Principal
            </a>

            <a href="formpersonal.html" class="boton_formulario">
                + Registrar Nuevo Personal
            </a>
        </div>

        <h2>PERSONAL MEDICO</h2>

        <table>
            <thead>
                <tr>
                    <th>ID Personal</th>
                    <th>Nombre</th>
                    <th>Apellido Paterno</th>
                    <th>Apellido Materno</th>
                    <th>Género</th>
                    <th>Rol</th>
                    <th>Especialidad</th>
                    <th>Cédula</th>
                    <th>RFC</th>
                    <th>Correo Electrónico</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla">
            </tbody>
        </table>

    </main>

    <footer>
        REBECA MIRANDA RASCON DEVORA 4;J 24308051280884 PROGRAMACION
    </footer>

    <script>
      const API_URL = "https://prueba-rmrd.onrender.com/api/personal";

      async function cargarPersonal() {
        try {
          const res = await fetch(API_URL);
          const datos = await res.json();
          const cuerpoTabla = document.getElementById('cuerpoTabla');
          cuerpoTabla.innerHTML = "";

          datos.forEach(p => {
            const fila = document.createElement('tr');
            fila.classList.add('texto_capital');
            fila.innerHTML = `
              <td>${p.id_personal ?? ''}</td>
              <td>${p.nombre ?? ''}</td>
              <td>${p.apellido_paterno ?? ''}</td>
              <td>${p.apellido_materno ?? ''}</td>
              <td>${p.genero ?? ''}</td>
              <td>${p.rol ?? ''}</td>
              <td>${p.especialidad ?? ''}</td>
              <td>${p.cedula_profesional ?? ''}</td>
              <td style="text-transform: uppercase;">${p.RFC ?? ''}</td>
              <td style="text-transform: none;">${p.correo_electronico ?? ''}</td>
            `;
            cuerpoTabla.appendChild(fila);
          });
        } catch (error) {
          console.error("Error al cargar personal:", error);
        }
      }

      cargarPersonal();
    </script>
</body>
</html>

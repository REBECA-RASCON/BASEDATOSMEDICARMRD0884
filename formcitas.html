<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Citas Médicas</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: bold;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, textarea:focus {
            border-color: #3498db;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1f618d;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            color: #2980b9;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>REGISTRO DE CITA MÉDICA</h2>
    
    <form id="formCitas">
        <label for="id_cita">ID CITA:</label>
        <input type="number" id="id_cita" required placeholder="Ej: 34577">

        <label for="paciente">NOMBRE DEL PACIENTE:</label>
        <input type="text" id="paciente" required placeholder="Nombre completo del paciente">

        <label for="doctor">MÉDICO ASIGNADO:</label>
        <input type="text" id="doctor" required placeholder="Nombre del doctor">

        <label for="fecha">FECHA DE LA CITA:</label>
        <input type="text" id="fecha" required placeholder="Ej: 12/02/26">

        <label for="hora">HORA:</label>
        <input type="text" id="hora" required placeholder="Ej: 1:00 pm">

        <label for="sala">SALA ASIGNADA:</label>
        <input type="text" id="sala" required placeholder="Ej: Sala 15">

        <label for="motivo">MOTIVO DE LA CONSULTA:</label>
        <textarea id="motivo" rows="3" required placeholder="Describa el motivo médico..."></textarea>

        <button type="submit">INSERTAR REGISTRO</button>
    </form>

    <a href="citas.html" class="back-link">← Cancelar y Volver</a>
</div>

<script>
    document.getElementById('formCitas').addEventListener('submit', function(event) {
        event.preventDefault();

        // CONSTRUCCIÓN DEL OBJETO CON LOS CAMPOS IDENTICOS A TU BASE DE DATOS
        const datosCita = {
            id_cita: Number(document.getElementById('id_cita').value),
            paciente_nombre: document.getElementById('paciente').value,
            doctor_nombre: document.getElementById('doctor').value,
            fecha: document.getElementById('fecha').value,
            hora: document.getElementById('hora').value,
            sala: document.getElementById('sala').value,
            motivo_de_cita: document.getElementById('motivo').value
        };

        // ENVÍO DIRECTO A TU BACKEND DE FIREBASE STUDIO
        fetch('https://8080-rasconrebeca0884-84541037.idxdev.googleusercontent.com/api/citas', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(datosCita)
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Error en la respuesta del servidor backend');
            }
            return response.json();
        })
        .then(data => {
            // MENSAJE DE ÉXITO VISIBLE ESPERADO
            alert('¡Excelente! Cita registrada correctamente en MongoDB Atlas.');
            document.getElementById('formCitas').reset(); // Limpia el formulario
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Error: No se pudo conectar con el servidor. Verifica que Firebase Studio esté encendido.');
        });
    });
</script>

</body>
</html>

<head>
    <meta charset="UTF-8">

    <title>Registro de Citas - Consultorio Médico RMRD</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #e6f0fa;
            color: #333333;
        }

        .cabecera {
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 20px;
            border-bottom: 4px solid #002060;
        }

        .cabecera h1 {
            font-family: 'Montserrat', sans-serif;
            color: #002060;
            margin: 0;
            font-size: 30px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .menu_navegacion {
            display: flex;
            justify-content: space-around;
            background-color: #f0f6fc;
            padding: 15px 0;
            border-bottom: 1px solid #b0c9f0;
        }

        .menu_navegacion a {
            font-family: 'Montserrat', sans-serif;
            color: #2a75d3;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.3s;
        }

        .menu_navegacion a:hover {
            color: #002060;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .contenedor_tabla {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            background-color: white;
        }

        .contenedor_tabla h2 {
            font-family: 'Montserrat', sans-serif;
            color: #2a75d3;
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-size: 22px;
        }

        .barra_botones {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .boton_volver {
            color: #555;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            font-family: 'Montserrat', sans-serif;
            transition: color 0.3s;
        }

        .boton_volver:hover {
            color: #002060;
        }

        .boton_formulario {
            display: inline-block;
            padding: 10px 20px;
            background-color: #002060;
            color: white;
            border-radius: 4px;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.3s ease;
        }

        .boton_formulario:hover {
            background-color: #2a75d3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            font-size: 14px;
        }

        th {
            font-family: 'Montserrat', sans-serif;
            background-color: #002060;
            color: white;
            padding: 10px;
            text-align: left;
            border: 1px solid #002060;
        }

        td {
            padding: 10px;
            border: 1px solid #b0c9f0;
        }

        .btn-eliminar {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 12px;
        }

        .btn-eliminar:hover {
            background-color: #cc0000;
        }

        footer {
            font-family: 'Montserrat', sans-serif;
            margin-top: 60px;
            padding: 15px;
            border-top: 2px dashed #002060;
            font-size: 11px;
            color: #555555;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header class="cabecera">
        <h1>Consultorio Médico RMRD</h1>
    </header>

    <nav class="menu_navegacion">
        <a href="pacientes.html">Clientes</a>
        <a href="doctores.html">Médicos</a>
        <a href="personal.html">Personal</a>
        <a href="citas.html">Citas</a>
    </nav>

    <main class="contenedor_tabla">

        <div class="barra_botones">
            <a href="index.html" class="boton_volver">&larr; Volver al Menú Principal</a>
            <a href="formcitas.html" class="boton_formulario">+ Registrar Nueva Cita</a>
        </div>

        <h2>CITAS</h2>
        
        <table>
            <thead>
                <tr>
                    <th>ID Cita</th>
                    <th>Paciente</th>
                    <th>Doctor</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Sala</th>
                    <th>Motivo de la Cita</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaCitasBody">
                </tbody>
        </table>
    </main>

    <footer>
        REBECA MIRANDA RASCON DEVORA 4;J 24308051280884 PROGRAMACION
    </footer>

    <script>
        // URL pública de tu backend en Firebase Studio
        const API_URL = "https://8080-rasconrebeca0884-84541037.idxdev.googleusercontent.com/api/citas";
        const tablaBody = document.getElementById('tablaCitasBody');

        // FUNCIÓN PARA SOLICITAR Y CARGAR REGISTROS EN LA TABLA
        async function obtenerCitas() {
            tablaBody.innerHTML = "<tr><td colspan='8' style='text-align:center;'>Cargando citas médicas desde la nube...</td></tr>";
            
            try {
                const respuesta = await fetch(API_URL);
                const citas = await respuesta.json();
                
                tablaBody.innerHTML = ""; // Limpiar mensaje de carga

                if (citas.length === 0) {
                    tablaBody.innerHTML = "<tr><td colspan='8' style='text-align:center;'>No existen registros de citas.</td></tr>";
                    return;
                }

                // Generar filas por cada documento en MongoDB
                citas.forEach(cita => {
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td>${cita.id_cita || 'N/A'}</td>
                        <td>${cita.paciente}</td>
                        <td>${cita.doctor}</td>
                        <td>${cita.fecha}</td>
                        <td>${cita.hora}</td>
                        <td>${cita.sala}</td>
                        <td>${cita.motivo}</td>
                        <td>
                            <button class="btn-eliminar" onclick="eliminarCita('${cita._id}')">Eliminar</button>
                        </td>
                    `;
                    tablaBody.appendChild(fila);
                });
            } catch (error) {
                console.error("Error al cargar citas:", error);
                tablaBody.innerHTML = "<tr><td colspan='8' style='text-align:center; color:red; font-weight:bold;'>Error al conectar con el servidor backend.</td></tr>";
            }
        }

        // FUNCIÓN PARA BORRAR UN REGISTRO
        async function eliminarCita(id) {
            if (!confirm("¿Estás segura de que deseas eliminar permanentemente esta cita médica?")) return;

            try {
                const respuesta = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                if (respuesta.ok) {
                    alert("Cita médica eliminada con éxito.");
                    obtenerCitas(); // Recargar la lista visual de inmediato
                } else {
                    alert("El servidor no pudo procesar la eliminación.");
                }
            } catch (error) {
                console.error("Error al borrar:", error);
                alert("Ocurrió un error en la comunicación con el servidor backend.");
            }
        }

        // Arrancar la función de lectura cuando el archivo se abra
        window.onload = obtenerCitas;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Nueva Cita - Consultorio Médico RMRD</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #e6f0fa;
            color: #333333;
        }

        .cabecera {
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 20px;
            border-bottom: 4px solid #002060;
        }

        .cabecera h1 {
            font-family: 'Montserrat', sans-serif;
            color: #002060;
            margin: 0;
            font-size: 30px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .contenedor_formulario {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .contenedor_formulario h2 {
            font-family: 'Montserrat', sans-serif;
            color: #2a75d3;
            text-align: center;
            margin-bottom: 25px;
            text-transform: uppercase;
            font-size: 20px;
        }

        .grupo_campo {
            margin-bottom: 18px;
        }

        .grupo_campo label {
            display: block;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 6px;
            color: #002060;
            text-transform: uppercase;
        }

        .grupo_campo input, .grupo_campo textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #b0c9f0;
            border-radius: 4px;
            font-family: 'Open Sans', sans-serif;
            font-size: 14px;
            box-sizing: border-box;
        }

        .grupo_campo input:focus, .grupo_campo textarea:focus {
            outline: none;
            border-color: #2a75d3;
        }

        .botones_accion {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        .btn-cancelar {
            color: #555;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            align-self: center;
            font-family: 'Montserrat', sans-serif;
        }

        .btn-guardar {
            padding: 12px 25px;
            background-color: #002060;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.3s;
        }

        .btn-guardar:hover {
            background-color: #2a75d3;
        }

        footer {
            font-family: 'Montserrat', sans-serif;
            margin-top: 60px;
            padding: 15px;
            border-top: 2px dashed #002060;
            font-size: 11px;
            color: #555555;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header class="cabecera">
        <h1>Consultorio Médico RMRD</h1>
    </header>

    <main class="contenedor_formulario">
        <h2>Registrar Nueva Cita</h2>
        
        <form id="formularioCita">
            <div class="grupo_campo">
                <label for="id_cita">ID Cita:</label>
                <input type="text" id="id_cita" required placeholder="Ej: 354477">
            </div>
            
            <div class="grupo_campo">
                <label for="paciente">Nombre del Paciente:</label>
                <input type="text" id="paciente" required placeholder="Ej: Odette Marquez Pinto">
            </div>
            
            <div class="grupo_campo">
                <label for="doctor">Médico Asignado:</label>
                <input type="text" id="doctor" required placeholder="Ej: Roberto Aguilar">
            </div>
            
            <div class="grupo_campo">
                <label for="fecha">Fecha de la Cita:</label>
                <input type="text" id="fecha" required placeholder="Ej: 12/02/26">
            </div>
            
            <div class="grupo_campo">
                <label for="hora">Hora:</label>
                <input type="text" id="hora" required placeholder="Ej: 1:00 pm">
            </div>
            
            <div class="grupo_campo">
                <label for="sala">Sala asignada:</label>
                <input type="text" id="sala" required placeholder="Ej: sala 15">
            </div>
            
            <div class="grupo_campo">
                <label for="motivo">Motivo de la Consulta:</label>
                <textarea id="motivo" rows="3" required placeholder="Ej: malestar estomacal"></textarea>
            </div>
            
            <div class="botones_accion">
                <a href="citas.html" class="btn-cancelar">&larr; Cancelar y Volver</a>
                <button type="submit" class="btn-guardar">Insertar Registro</button>
            </div>
        </form>
    </main>

    <footer>
        REBECA MIRANDA RASCON DEVORA 4;J 24308051280884 PROGRAMACION
    </footer>

    <script>
        // URL pública de tu backend en Firebase Studio
        const API_URL = "https://8080-rasconrebeca0884-84541037.idxdev.googleusercontent.com/api/citas";
        const form = document.getElementById('formularioCita');

        // INTERCEPTAR EVENTO DE SUBMIT DEL FORMULARIO
        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // Detener recarga de pantalla tradicional

            // Estructurar el JSON tal como lo espera recibir el backend en Node.js
            const nuevaCita = {
                // Dentro de la función que guarda en tu HTML, asegúrate de que luzca así:
                id_cita: Number(document.getElementById('id_cita').value), // Convierte a número
                paciente_nombre: document.getElementById('paciente_nombre').value,
                doctor_nombre: document.getElementById('doctor_nombre').value,
                fecha: document.getElementById('fecha').value,
                hora: document.getElementById('hora').value,
                sala: document.getElementById('sala').value,
                motivo_de_cita: document.getElementById('motivo_de_cita').value
                        };

            try {
                const respuesta = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(nuevaCita)
                });

                if (respuesta.ok) {
                    alert("Registro médico insertado con éxito en MongoDB.");
                    window.location.href = "citas.html"; // Redirección automática a la tabla visual
                } else {
                    alert("Error: El servidor backend rechazó los datos.");
                }
            } catch (error) {
                console.error("Error al insertar:", error);
                alert("No fue posible comunicarse con el servidor de Firebase Studio.");
            }
        });
    </script>
</body>
</html>
